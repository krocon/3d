<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Models Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        #filter {
            width: 100%;
            max-width: 600px;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #filter:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .thumbnail {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .thumbnail:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.4);
            border-color: #38bdf8;
        }

        .thumbnail-img-container {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background-color: #0f172a;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .thumbnail:hover img {
            transform: scale(1.05);
        }

        .thumbnail p {
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #e2e8f0;
            text-align: center;
            line-height: 1.3;
            word-break: break-word;
        }

        /* Detail Modal */
        #detail {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            overflow-y: auto;
            padding: 24px;
        }

        #detail-content {
            max-width: 900px;
            margin: 40px auto;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        #close-detail {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #334155;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        #close-detail:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        #detail-content h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 20px;
            padding-right: 40px;
        }

        #detail-content pre {
            background: #0f172a;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 0.9rem;
            color: #cbd5e1;
            white-space: pre-wrap;
            /*max-height: 250px;*/
            overflow-y: auto;
            margin-bottom: 24px;
        }

        #detail-content a {
            color: #38bdf8;
            text-decoration: none;
        }

        #detail-content a:hover {
            text-decoration: underline;
        }

        .download-section {
            margin-bottom: 28px;
        }

        .download-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .download-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .download-list li a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #38bdf8;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .download-list li a:hover {
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
        }

        /* Thumbnails Section at bottom of Detail View */
        .detail-thumbs-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        .detail-thumbs-section h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-thumbs-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .detail-thumb-item {
            width: 110px;
            height: 110px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #334155;
            cursor: pointer;
            position: relative;
            background: #0f172a;
            transition: all 0.2s ease;
        }

        .detail-thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .detail-thumb-item:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.3);
        }

        .detail-thumb-item:hover img {
            transform: scale(1.1);
        }

        /* Fullscreen Lightbox Modal */
        #fullscreen-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(10px);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #fullscreen-close {
            position: absolute;
            top: 24px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 2010;
        }

        #fullscreen-close:hover {
            background: rgba(239, 68, 68, 0.8);
            transform: scale(1.1);
        }

        .fullscreen-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 2010;
            user-select: none;
        }

        .fullscreen-nav:hover {
            background: rgba(56, 189, 248, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .fullscreen-prev {
            left: 24px;
        }

        .fullscreen-next {
            right: 24px;
        }

        .fullscreen-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 92vw;
            max-height: 90vh;
        }

        #fullscreen-image {
            max-width: 90vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            transition: opacity 0.2s ease;
        }

        #fullscreen-caption {
            margin-top: 16px;
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: 500;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>3D Models Viewer</h1>
            <input type="text" id="filter" placeholder="Modelle filtern...">
        </header>

        <div id="gallery"></div>
    </div>

    <!-- Detail Modal -->
    <div id="detail">
        <div id="detail-content">
            <div id="close-detail">&times;</div>
            <div id="detail-body"></div>
        </div>
    </div>

    <!-- Fullscreen Image Lightbox -->
    <div id="fullscreen-viewer">
        <button id="fullscreen-close" aria-label="Schließen">&times;</button>
        <button id="fullscreen-prev" class="fullscreen-nav fullscreen-prev" aria-label="Vorheriges Bild">&#10094;</button>
        <button id="fullscreen-next" class="fullscreen-nav fullscreen-next" aria-label="Nächstes Bild">&#10095;</button>
        <div class="fullscreen-content">
            <img id="fullscreen-image" src="" alt="Vollbild">
            <div id="fullscreen-caption"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
